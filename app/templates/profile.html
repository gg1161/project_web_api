{% extends "base.html" %}

{% block title %}Профиль — {{ current_user.username }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Профиль пользователя</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <strong>Имя пользователя:</strong> {{ current_user.username }}
                </div>
                <div class="mb-3">
            <strong>Email:</strong> {{ current_user.email }}
                </div>

                <div class="mt-4">
                    <a href="{{ url_for('weather') }}" class="btn btn-info">
                <i class="bi bi-cloud-sun"></i> Посмотреть погоду
            </a>
        </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
